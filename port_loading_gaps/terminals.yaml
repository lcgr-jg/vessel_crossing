# Terminal report registry.
#
# How to add another terminal (e.g. zirku, das, um_lulu):
# 1. Add a top-level key under `terminals:` (snake_case id).
# 2. Set kpler.name / kpler.kind to the zone or installation used in Kpler UI.
# 3. Set imagery.aoi_key + geojson for one crop, OR imagery.panels: [...] for
#    multi-SPM facilities (Das / Zirku) — side-by-side raw + NDWI in the HTML.
# 4. Optional: imagery.show_debug (+ berth_slots_px per panel) for NDWI appendix.
# 5. Optional zone "installation TBD" section (see yanbu_unallocated):
#      kpler: { name: <Zone>, kind: zone }
#      slate: { require_blank_installation: true }
#      report: { include_gap_chart: false, include_flows: false, include_satellite: false }
# 6. Optionally add terminal-specific events; shared events apply to all.
# 7. Re-run terminal_report.ipynb with TERMINALS including the new id.
#
# Imagery detection counts are intentionally NOT used in the client-facing blurb.

chart_start: 2026-02-01
product: crude
flow_unit: kbd
ma_days: 7
slate_back: 3
slate_forward: 3
sat_lookback_days: 45
sat_max_cloud: 30

# Shared vertical markers on gap charts (edit freely).
events:
  - date: 2026-02-28
    label: Iran war started

